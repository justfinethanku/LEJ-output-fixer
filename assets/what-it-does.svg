<svg viewBox="0 0 960 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="output-fixer-title" aria-describedby="output-fixer-description">
  <title id="output-fixer-title">LEJ Output Fixer makes Claude's answers easier to read</title>
  <desc id="output-fixer-description">Dense Claude output becomes answer-first text with short paragraphs. One picker command offers Scannable, Bottom Line First, and Walk Me Through It styles in the terminal and Desktop app.</desc>
  <!-- card background: self-contained so it reads on light and dark GitHub themes -->
  <rect x="0" y="0" width="960" height="320" rx="14" fill="#ffffff" stroke="#d0d0d0" stroke-width="1"/>

  <!-- PANEL 1: dense output -->
  <text x="160" y="48" text-anchor="middle" font-size="15" font-weight="bold" fill="#666" letter-spacing="2">WHAT CLAUDE GIVES YOU</text>
  <rect x="40" y="64" width="240" height="176" rx="6" fill="#fafafa" stroke="#aaaaaa" stroke-width="1.5"/>
  <g fill="#9a9a9a">
    <rect x="56" y="80"  width="208" height="5"/><rect x="56" y="91"  width="208" height="5"/>
    <rect x="56" y="102" width="208" height="5"/><rect x="56" y="113" width="208" height="5"/>
    <rect x="56" y="124" width="208" height="5"/><rect x="56" y="135" width="208" height="5"/>
    <rect x="56" y="146" width="208" height="5"/><rect x="56" y="157" width="208" height="5"/>
    <rect x="56" y="168" width="208" height="5"/><rect x="56" y="179" width="208" height="5"/>
    <rect x="56" y="190" width="208" height="5"/><rect x="56" y="201" width="208" height="5"/>
    <rect x="56" y="212" width="208" height="5"/><rect x="56" y="223" width="150" height="5"/>
  </g>

  <!-- arrow 1 -->
  <line x1="292" y1="152" x2="342" y2="152" stroke="#111" stroke-width="4"/>
  <polygon points="342,142 360,152 342,162" fill="#111"/>

  <!-- PANEL 2: the fixer -->
  <text x="480" y="48" text-anchor="middle" font-size="15" font-weight="bold" fill="#666" letter-spacing="2">ONE COMMAND</text>
  <rect x="368" y="64" width="224" height="176" rx="6" fill="#111111"/>
  <text x="480" y="106" text-anchor="middle" font-size="26" font-weight="bold" fill="#ffffff">LEJ</text>
  <text x="480" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff" letter-spacing="1">OUTPUT FIXER</text>
  <line x1="400" y1="146" x2="560" y2="146" stroke="#444" stroke-width="1"/>
  <text x="480" y="170" text-anchor="middle" font-size="14" fill="#bbbbbb">pick how Claude talks:</text>
  <text x="480" y="192" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Scannable</text>
  <text x="480" y="211" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Bottom Line First</text>
  <text x="480" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Walk Me Through It</text>

  <!-- arrow 2 -->
  <line x1="604" y1="152" x2="654" y2="152" stroke="#111" stroke-width="4"/>
  <polygon points="654,142 672,152 654,162" fill="#111"/>

  <!-- PANEL 3: readable output -->
  <text x="800" y="48" text-anchor="middle" font-size="15" font-weight="bold" fill="#666" letter-spacing="2">WHAT YOU READ INSTEAD</text>
  <rect x="680" y="64" width="240" height="176" rx="6" fill="#ffffff" stroke="#111" stroke-width="2"/>
  <!-- the answer, first and bold -->
  <rect x="696" y="82" width="184" height="9" fill="#111111"/>
  <!-- short readable paragraphs with real gaps -->
  <g fill="#9a9a9a">
    <rect x="696" y="106" width="208" height="5"/><rect x="696" y="117" width="176" height="5"/>
    <rect x="696" y="140" width="208" height="5"/><rect x="696" y="151" width="192" height="5"/>
    <rect x="696" y="162" width="120" height="5"/>
    <rect x="696" y="186" width="200" height="5"/><rect x="696" y="197" width="144" height="5"/>
  </g>
  <text x="696" y="228" font-size="13" font-weight="bold" fill="#111">answer first, short paragraphs</text>

  <!-- caption -->
  <text x="480" y="284" text-anchor="middle" font-size="16" fill="#333">Three ready-made styles for Claude Code, plus a picker. Works in the terminal and the Desktop app.</text>
</svg>
